name: Hata bildirimi
description: Bir hatayı bildirin
title: "[Hata]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Ne oldu?
      description: Beklenen ve gerçekleşen davranışı yazın.
    validations:
      required: true
  - type: input
    id: watch
    attributes:
      label: Saat modeli ve Wear OS sürümü
      placeholder: "Galaxy Watch 7, Wear OS 5"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: iPhone modeli ve iOS sürümü
      placeholder: "iPhone 13, iOS 18"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Loglar
      description: "adb logcat -s WatchBridge GattQueue çıktısı"
      render: shell
